[project]
name = "polymarket-analytics"
version = "0.1.0"
description = "Real-time analytics dashboard for Polymarket traders — wallet tracking, market insights, alpha calls, and leaderboard rankings"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "aiosignal>=1.3",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7",
    "psycopg2-binary>=2.9",
    "pydantic>=2.10",
    "pyjwt>=2.10",
    "python-dotenv>=1.0.0",
    "redis>=5.2",
    "slowapi>=0.1",
    "sqlalchemy>=2.0",
    "statsbombpy>=1.19.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src"]
executionEnvironments = [
  { root = "." }
]
