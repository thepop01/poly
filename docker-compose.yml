version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: poly_user
      POSTGRES_PASSWORD: poly_password
      POSTGRES_DB: poly_db
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: '1gb'
    command: postgres -c max_connections=600 -c shared_buffers=512MB -c work_mem=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-poly_redis_pass} --save 60 1 --loglevel warning
volumes:
  postgres_data:
  redis_data:
